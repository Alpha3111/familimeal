<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05020b">
<title>FamiliMeal</title>
<style>
html,body{margin:0;min-height:100%;background:#05020b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(155,92,255,.25),transparent 30%),#05020b}h1{letter-spacing:.12em;margin:0 0 8px}p,small{color:#b9a9ce}
</style>
</head>
<body>
<div id="load"><div><h1>FAMILIMEAL</h1><p>Chargement de votre espace familial…</p></div></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('Ce navigateur doit être mis à jour.');
    const files=['v6/gzpart00.txt','v6/gzpart01.txt','v6/gzpart02.txt','v6/gzpart03.txt','v6/gzpart04.txt'];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?v=6.1',{cache:'no-store'});
      if(!r.ok) throw new Error('Fichier manquant : '+f);
      return (await r.text()).trim();
    }));
    const raw=atob(parts.join(''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('load').innerHTML='<div><h1>FamiliMeal</h1><p>Impossible de charger l’application.</p><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
<!-- force-pages-redeploy-2026-09-01 -->
</body>
</html>
