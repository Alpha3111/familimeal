<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05020b">
<title>FamiliMeal</title>
<style>
html,body{margin:0;min-height:100%;background:#05020b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(155,92,255,.25),transparent 30%),#05020b}h1{letter-spacing:.12em;margin:0 0 8px}p,small{color:#b9a9ce}.retry{margin-top:16px;padding:10px 16px;border:0;border-radius:12px;background:#8f5cff;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="load"><div><h1>FamiliMeal</h1><p>Chargement de votre espace familial…</p></div></div>
<script src="v7/p0.js?v=7.2"></script>
<script src="v7/p1.js?v=7.2"></script>
<script src="v7/p2.js?v=7.2"></script>
<script src="v7/p3.js?v=7.2"></script>
<script src="v7/p4.js?v=7.2"></script>
<script>
(async()=>{
  const load=document.getElementById('load');
  try{
    if(!window.__FMV7 || window.__FMV7.length!==5 || window.__FMV7.some(x=>!x)) throw new Error('Fichiers V7 incomplets.');
    if(!('DecompressionStream' in window)) throw new Error('Ce navigateur doit être mis à jour pour charger FamiliMeal.');
    const raw=atob(window.__FMV7.join(''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    load.innerHTML='<div><h1>FamiliMeal</h1><p>Impossible de charger l’application.</p><small>'+String(e.message||e)+'</small><br><button class="retry" onclick="location.reload()">Réessayer</button></div>';
  }
})();
</script>
</body>
</html>
